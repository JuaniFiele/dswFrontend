<app-med-menu></app-med-menu>
<body>
  <div class="buscar-paciente-container">
      <h2>Buscar Paciente</h2>
      <form (ngSubmit)="buscarPaciente()">
        <label for="dni">DNI del Paciente:</label>
        <input
          type="text"
          id="dni"
          [(ngModel)]="dni"
          name="dni"
          placeholder="Ingrese el DNI"
          required
        />
        <div *ngIf="error" class="error-text">
          El DNI es un campo <strong>Obligatorio</strong>
        </div>
        <div *ngIf="errorDeDNI" class="error-text">
          No se encontró ese paciente, revise el DNI ingresado
        </div>
        <button type="submit">Buscar</button>
      </form>
  </div>
</body>
